version: '3'

services:
  db:
    image: postgres:14.3
    restart: always
    ports:
      - "5442:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=America/La_Paz
      - PGTZ=America/La_Paz
    container_name: intellispacedb
    volumes:
      - ./postgres:/var/lib/postgresql/data